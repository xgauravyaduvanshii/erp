name: Release Dry Run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - README.md
      - bin/**
      - src/**

jobs:
  publish-dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run publish dry run
        run: npm publish --dry-run
