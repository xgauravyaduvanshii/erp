name: Usage question
description: Ask how to use ERP for a specific workflow
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Describe your app setup and what you want ERP to do.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What have you tried?
      description: Include commands, ports, and whether the issue is local or remote.
